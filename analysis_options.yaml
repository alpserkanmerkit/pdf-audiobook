# Gate config: make check-fast runs `flutter analyze --fatal-infos` ->
# every info/warning fails the build.
include: package:very_good_analysis/analysis_options.yaml

analyzer:
  language:
    strict-casts: true
    strict-inference: true
    strict-raw-types: true

linter:
  rules:
    # Kept from the previous config (not enabled in very_good_analysis).
    prefer_final_locals: true
    # --- Justified exclusions (measured finding counts: 2026-10-07, very_good_analysis 10.0.0) ---
    # 866 findings: this is an app, not a package; no consumer reads a public API doc.
    public_member_api_docs: false
    # 341 findings: dart format already wraps code at 80; the rest are long Turkish strings/comments/URL lines
    # (wrapping would risk changing message text, and it conflicts with the formatter).
    lines_longer_than_80_chars: false
    # 13 findings (5 lib + 8 test): the rule prefers async dart:io (exists/readAsString...) over the sync call;
    # in an app, sync I/O blocks the UI isolate -> behavior/performance regresses. The rule's reasoning does not hold here.
    avoid_slow_async_io: false
